<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Professor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ubuntu', sans-serif;
        }

        body {
            background-color: #FCD2B2; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .browser-left {
            display: flex;
            gap: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 600px;
            height: 30px;
            background-color: #FFFDE8;
            border-radius: 20px;
            margin: 0 20px;
            position: relative;
        }

        .search-bar::after {
            content: '🔍';
            position: absolute;
            right: 15px;
            top: 5px;
            font-size: 14px;
            color: #8CAAB9;
        }

        .browser-right {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .login-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
        }

        .login-icon {
            width: 24px;
            height: 24px;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
            margin-bottom: 2px;
        }

        .navbar {
            width: 100%;
            background-color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
        }

        .navbar a {
            text-decoration: none;
            color: #8BA9B9;
            font-size: 22px;
            font-weight: 500;
        }

        .main-container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            color: #BC5A6D;
            font-size: 55px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .dashboard-panel {
            background-color: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .welcome-banner {
            background-color: #FFB37C;
            color: white;
            border-radius: 20px;
            padding: 25px;
            text-align: left;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 250px;
            border-radius: 25px;
            padding: 25px 20px;
            color: white;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 200px;
        }

        .card h3 {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.9;
        }

        .card p {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.3;
        }

        .card-blue {
            background-color: #8BA9B9;
        }

        .card-pink {
            background-color: #BC5A6D;
        }

        .card-orange {
            background-color: #FFB37C;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#">Quiz</a>
        <a href="#">Atividades</a>
        <a href="#">Desempenho</a>
    </nav>

    <div class="main-container">
        <h1>Home</h1>
        
        <div class="dashboard-panel">
            <div class="welcome-banner">
                Bem-vindo(a), (professor)!<br>
                Pronto para gerar quizzes, atividades e dentre outros?
            </div>

            <div class="cards-container">
                
                <div class="card card-blue">
                    <h3>Atividades geradas</h3>
                    <p>Atividade avaliativa de Biologia</p>
                </div>

                <div class="card card-pink">
                    <h3>Último quiz gerado</h3>
                    <p>Matéria: Biologia<br>Feedback: Alunos com dificuldades</p>
                </div>

                <div class="card card-orange">
                    <h3>Desempenho</h3>
                    <p>30% das salas estão abaixo do básico</p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
